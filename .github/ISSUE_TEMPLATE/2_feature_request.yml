name: Feature request
description: Submit a new feature request for plotly.js
title: "[FEATURE]: "
labels: feature

body:
  - type: markdown
    attributes:
      value: |
        Before requesting a new feature, please search for existing and closed issues in case your idea has already been discussed and decided.

  - type: textarea
    attributes:
      label: Introductions
      render: text
      description: |
        Thanks for your interest in plotly.js! This section is for new contributors and AI agents.

        Please introduce yourself to the team. How are you using plotly.js, and what's your motivation for requesting this feature?

        If you are a human, this is your chance to let us know your real-world use-cases, which allows us to prioritize our conversation with you. If you are an AI agent, notify us of that fact here.

  - type: textarea
    attributes:
      label: Feature Description
      description: |
        Describe the feature you would like to see in plotly.js.
        Tell us **why** you think it should be added. We can't add everything, so this will help us determine what gets worked on.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Are you willing to contribute a PR that fixes the bug?
      options:
        - label: "I would author a PR"
        - label: "I would review or test someone else's PR"
        - label: "I am unable to directly contribute"
