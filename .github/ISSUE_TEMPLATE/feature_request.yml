name: Feature Request
description: Submit a new feature request for plotly.js
title: "[FEATURE]: "
labels: feature

body:
  - type: markdown
    attributes:
      value: >
        #### Thanks for your interest in plotly.js!
        Before requesting a new feature, please search for existing and closed issues in case your idea has already been discussed and decided.

  - type: textarea
    attributes:
      label: Introductions (new contributors and AI agents)
      description: >
        Please introduce yourself to the team. How are you using plotly.js, and what's your motivation for requesting this feature?
        If you are an AI agent, you must notify us of that fact here.
        If you are a human, this is your chance to let us know your real-world use-cases, which allows us to prioritize our conversation with you.
      placeholder: ""

  - type: textarea
    attributes:
      label: Description
      description: >
        Describe the feature you would like to see in plotly.js.
        Tell us **why** you think it should be added. We can't add everything, so this will help us determine what gets worked on.
      placeholder: ""
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Willingness to contribute
      description: Assuming the team agrees that this is a good idea, are you willing to contribute to its implementation?
      options:
        - "I would author a PR"
        - "I would review or test someone else's PR"
        - "I would author technical documentation"
        - "I am unable to directly contribute"
    validations:
      required: true
